name: Import upstream once (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baribudos-upstream-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download upstream source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream"
          curl --fail --location --silent --show-error \
            "https://github.com/darkzOGx/youtube-automation-agent/archive/refs/heads/master.tar.gz" \
            -o "$RUNNER_TEMP/upstream/source.tar.gz"
          mkdir -p "$RUNNER_TEMP/upstream/extracted"
          tar -xzf "$RUNNER_TEMP/upstream/source.tar.gz" \
            -C "$RUNNER_TEMP/upstream/extracted" --strip-components=1
          test -f "$RUNNER_TEMP/upstream/extracted/LICENSE" || \
            test -f "$RUNNER_TEMP/upstream/extracted/LICENSE.md" || \
            test -f "$RUNNER_TEMP/upstream/extracted/LICENSE.txt"

      - name: Copy project files without importing upstream workflows
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/upstream/extracted/"
          # Keep the destination's temporary importer workflow; never copy upstream Actions workflows.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$SRC" ./
          # Defensive check: this import must not add any upstream workflow files.
          git status --short

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit; destination already matches the imported source."
            exit 0
          fi
          git commit -m "Import youtube-automation-agent source without upstream workflows"
          git push origin HEAD:main
